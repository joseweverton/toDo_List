<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
    <title>To-Do List - Lista de Tarefas</title>
</head>

<body>
    <header class="header-bg">
        <div class="header">
            <a href="#">&#x1F4DD; Lista de Tarefas</a>
            <button class="button-reset-checks">Reset Checks</button>
        </div>
    </header>

    <main class="container-bg">
        <div class="container">
            <input class="input-task" placeholder="O que tenho que fazer..." />
            <select class="select-periodicity">
                <option value="">Selecione a periodicidade</option>
                <option value="diario">Diário</option>
                <option value="semanal">Semanal</option>
                <option value="quinzenal">Quinzenal</option>
                <option value="mensal">Mensal</option>
            </select>
            <button class="button-add-task">Adicionar</button>
        </div>

        <section class="boards-container">
            <div class="boards-row boards-row-top">
                <div class="board-container">
                    <div class="board-header">
                        <h2>Diário</h2>

                        <button class="toggle-board" type="button" aria-expanded="true" aria-label="Recolher Diário">
                            ▲
                        </button>
                    </div>

                    <ul class="list-tasks" data-periodicity="diario"></ul>
                </div>

                <div class="board-container">
                    <div class="board-header">
                        <h2>Semanal</h2>

                        <button class="toggle-board" type="button" aria-expanded="true" aria-label="Recolher Semanal">
                            ▲
                        </button>
                    </div>
                    <ul class="list-tasks" data-periodicity="semanal"></ul>
                </div>
            </div>

            <div class="boards-row boards-row-bottom">
                <div class="board-container">
                    <div class="board-header">
                        <h2>Quinzenal</h2>

                        <button class="toggle-board" type="button" aria-expanded="true" aria-label="Recolher Quinzenal">
                            ▲
                        </button>
                    </div>
                    <ul class="list-tasks" data-periodicity="quinzenal"></ul>
                </div>
                <div class="board-container">
                    <div class="board-header">
                        <h2>Mensal</h2>

                        <button class="toggle-board" type="button" aria-expanded="true" aria-label="Recolher Mensal">
                            ▲
                        </button>
                    </div>
                    <ul class="list-tasks" data-periodicity="mensal"></ul>
                </div>
            </div>
        </section>
    </main>
</body>
<script src="scripts.js"></script>

</html>
